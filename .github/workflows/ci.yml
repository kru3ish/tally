name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@tally.local && git config --global user.name tally-ci
        shell: bash
      - run: npm ci
      - run: npm test
      - name: demo (definition of done)
        run: node dist/cli.js demo --plain --fast
      - name: calibration eval (regression; fails if agreement on the fixture sessions drops)
        run: node dist/cli.js calibrate eval --fail-below 0.9
      - name: install / uninstall round trip is byte-identical
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-home" TALLY_HOME="$RUNNER_TEMP/tally-home"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          printf '{\n\t"model": "opus",\n\t"hooks": {"Stop": [{"hooks": [{"type": "command", "command": "echo hi"}]}]}\n}' > "$CLAUDE_CONFIG_DIR/settings.json"
          before=$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.env.CLAUDE_CONFIG_DIR+'/settings.json')).digest('hex'))")
          node dist/cli.js install
          node dist/cli.js uninstall
          after=$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.env.CLAUDE_CONFIG_DIR+'/settings.json')).digest('hex'))")
          echo "before=$before after=$after"
          test "$before" = "$after"
